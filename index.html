<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hexle — Daily Color Guessing Game</title>
<meta name="description" content="Hexle is a free daily color-guessing game. You get a hex color and 5 tries to find the matching swatch on the grid — a new color every day, plus two practice rounds that don't count toward your streak.">
<link rel="canonical" href="https://hexle.us/">
<meta name="google-site-verification" content="bbJclyEYlvQSypvbv7do6s0xHoVHU6PsBIfWQsyJv6g" />

<!-- Open Graph / social link previews -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://hexle.us/">
<meta property="og:title" content="Hexle — Daily Color Guessing Game">
<meta property="og:description" content="Guess today's hex color in 5 tries. A free daily puzzle game, Wordle-style but for color.">
<meta property="og:image" content="https://hexle.us/icons/icon-512.png">

<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Hexle — Daily Color Guessing Game">
<meta name="twitter:description" content="Guess today's hex color in 5 tries. A free daily puzzle game, Wordle-style but for color.">
<meta name="twitter:image" content="https://hexle.us/icons/icon-512.png">

<!-- Structured data -- helps search engines understand this is a free, playable game -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Hexle",
  "url": "https://hexle.us",
  "description": "A free daily color-guessing game -- match today's hex color in 5 tries.",
  "applicationCategory": "Game",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
}
</script>

<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#121316">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hexle">
<link rel="stylesheet" href="style.css">
<!-- Cloudflare Web Analytics --><script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "f6941b6179d745a7a39e403154f3e8da"}'></script><!-- End Cloudflare Web Analytics -->
</head>
<body>
<div class="app-shell">
<header class="topbar">
  <h1>Hex<span class="accent">le</span></h1>
  <div class="topbar-actions">
    <button id="practice-btn" class="icon-btn" title="Practice puzzles" aria-label="Practice puzzles">🎯 II</button>
    <div id="mode-switcher" class="mode-switcher">
      <button data-mode="easy" class="mode-btn">Easy</button>
      <button data-mode="hard" class="mode-btn">Hard</button>
    </div>
    <button id="stats-btn" class="icon-btn" title="Stats" aria-label="Stats">📊</button>
    <button id="settings-btn" class="icon-btn" title="Settings" aria-label="Settings">⚙️</button>
    <button id="help-btn" class="icon-btn" title="How to play" aria-label="How to play">❓</button>
    <button id="install-btn" class="icon-btn" title="Add to Home Screen" aria-label="Add to Home Screen" hidden>📲</button>
  </div>
</header>

<main>
  <div class="fixed-top">
    <section class="prompt-card">
      <div id="prompt-swatch" class="prompt-swatch"></div>
      <div class="prompt-main">
        <div id="prompt-label" class="prompt-label">Today's color</div>
        <div id="prompt-hex" class="prompt-hex">#000000</div>
      </div>
      <div id="target-name-reveal" class="target-name-reveal"></div>
      <div id="attempts-remaining" class="attempts-remaining">5 guesses left</div>
    </section>
    <section id="latest-guess" class="latest-guess"></section>
  </div>

  <div class="grid-scroll-area">
    <section id="history" class="history"></section>
    <div class="grid-pan-wrapper">
      <section id="grid-container" class="grid-container"></section>
    </div>
    <div id="grid-footer" class="grid-footer"></div>
  </div>
</main>
</div>

<div id="modal-backdrop" class="modal-backdrop hidden">
  <div id="modal" class="modal"></div>
</div>

<script src="colors-data.js"></script>
<script src="targets.js"></script>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
